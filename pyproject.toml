[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Renamed from `scitex-todo` (operator directive 2026-07-15/16). The import
# package is `scitex_cards`; `scitex_todo` ships as a deprecated re-export
# shim for one transition window so un-cutover consumers keep working.
name = "scitex-cards"
version = "0.37.1"
description = "Canonical task-card store with pluggable adapters (mermaid dependency graphs)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
keywords = ["todo", "tasks", "dependency-graph", "mermaid", "science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# `scitex_config` is a FOUNDATIONAL ecosystem lib (not a leaf peer): it
# supplies `local_state.user_path`, the user-canonical path resolver the
# shadow-SQLite adapter (`_db.resolve_db_path`) delegates to instead of
# re-rolling a project/user precedence (RFC #348 S0).
dependencies = [
    "pyyaml",
    "click",
    "ruamel.yaml",
    "scitex_config",
    # PROMOTED FROM THE `postgres` EXTRA, 2026-08-02, by this test (scitex-dev):
    # WHEN THIS IS MISSING, DOES THE FAILURE NAME ITSELF?
    #
    # A capability whose absence raises `ModuleNotFoundError: torch` may stay
    # optional -- the error is self-describing and one grep from fixed. That is
    # why torch, browser and audio remain extras across the fleet, and why
    # "runtime capabilities become hard dependencies" is the wrong rule.
    #
    # psycopg fails the test. Measured on 2026-08-02, its absence surfaced as:
    #     "canonical store postgresql:/scitex_cards@... does not exist"
    #     "deadlock detected ... while updating tuple in relation pg_proc"
    # Neither text contains the words "postgres driver". Both name a subsystem
    # that was working. Two agents independently misattributed it -- one to a
    # missing database, one to a malformed URL -- and that misdirection is what
    # turned a five-minute fix into a fleet outage.
    #
    # The canonical store CAN be PostgreSQL. A client that cannot open the
    # canonical store is not a working client, so the driver is not optional in
    # any sense the user would recognise.
    #
    # `[binary]` bundles libpq, so this installs on a bare machine with no
    # PostgreSQL client libraries. SQLite remains the zero-config default.
    "psycopg[binary]>=3.1",
    # PROMOTED FROM THE `web`, `mcp` AND `currency` EXTRAS, 2026-08-03, under
    # the same test psycopg was promoted by: WHEN THIS IS MISSING, DOES THE
    # FAILURE NAME ITSELF? -- and under the operator's all-or-nothing ruling,
    # agreed with scitex-dev, who withdrew the ADR-0005 decision that `all`
    # must exclude dev/docs once the RUNTIME install became bare.
    #
    # THE RUNTIME INSTALL IS NOW `pip install scitex-cards`, with no extras at
    # all. That is the point: every hand-pickable subset was a chance to pick
    # the wrong one, and the fleet outage on 2026-08-01 was exactly that --
    # `scitex-cards[mcp]` resolved fine and produced a client that could not
    # open the canonical store. Removing the choice removes the failure.
    #
    # The board (django, scitex-app, scitex-ui) and the MCP server (fastmcp)
    # are not optional capabilities of this package in any sense a user would
    # recognise: the board IS how the operator reads the store, and the MCP
    # server IS how every agent writes to it.
    "django>=4.2",
    "scitex-app",
    # >=0.11.1 is MEASURED, not aspirational -- see the note in the `dev`
    # extra below for what breaks at 0.7.1 and why presence is not currency.
    "scitex-ui>=0.11.1",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # >=0.17.11 for the JobSpec service|timer|cron taxonomy + new
    # restart_policy field used by _jobs_provider.provide_jobs(). Older
    # versions don't have the kwarg and the leaf TypeErrors on import.
    "scitex-dev>=0.17.11",
    # Web-extra deps are imported (guarded) by the Django board source and its
    # tests; include them so a fresh `pip install -e .[dev]` runs the full
    # suite rather than silently skipping the board tests (PS-210).
    "django>=4.2",
    "scitex_app",
    # >=0.11.1, and the number is MEASURED rather than aspirational:
    #
    #   0.7.1  — the shell template's DEFAULT favicon. Our templates declare no
    #            <link rel="icon"> of their own any more, so an older shell
    #            renders NO icon at all.
    #   0.11.1 — `font-family: inherit` on `.stx-app-context-menu__item`. The
    #            chat page's right-click menu consumes base's context-menu.css
    #            and its items are <button>; buttons do not inherit the page
    #            font and base ships no global button reset, so below 0.11.1 the
    #            menu renders in the UA button font. `context-menu.css` EXISTS
    #            at 0.7.1 (verified by `git show v0.7.1:...`) without that rule
    #            — presence is not currency, which is exactly why a file-exists
    #            check could not have caught this and a floor has to.
    #
    # chat.html has documented the 0.11.1 requirement since #581 and said "the
    # upgrade ships alongside this"; it never did, so the declaration sat two
    # minor versions under what the code needs. A resolver honouring 0.7.1 gets
    # a page that renders and is subtly wrong — the failure mode a floor exists
    # to prevent. Do not loosen it.
    "scitex_ui>=0.11.1",
    # Same PS-210 reason as the web extras above, and caught by the same rule:
    # the backend tests import psycopg UNGUARDED, so without it here a fresh
    # `pip install -e .[dev]` collects them and errors rather than running the
    # suite. Declaring the `postgres` extra without this made the capability
    # installable but left the DEFAULT development install unable to exercise
    # it -- which is the same "reachable in principle, unreachable in practice"
    # gap the extra itself was added to close.
    "psycopg[binary]>=3.1",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
web = [
    # KEPT AS A REDUNDANT ALIAS, like `postgres` below and for the same reason:
    # django/scitex-app/scitex-ui are hard dependencies now (see `dependencies`),
    # so this extra adds nothing and `scitex-cards[web]` still resolves.
    #
    # IT RESTATES ITS REQUIREMENTS RATHER THAN BEING EMPTY, and that is PS-214,
    # not tidiness. An empty extra is a remedy that installs ZERO packages, so
    # anyone told "pip install scitex-cards[web]" runs it, stays exactly as
    # broken, and now believes they already tried the fix. `postgres` below has
    # restated psycopg for the same reason since the promotion. Listing a
    # requirement in both places is free -- pip resolves it once.
    #
    # THE REMOVAL IS SEQUENCED, NOT FORGOTTEN. The operator's ruling is a strict
    # {all, dev, docs} allowlist and this alias is not in it. It stays until the
    # pins outside this repo are updated -- measured 2026-08-03, three build
    # sites in scitex-agent-container name `scitex-cards[mcp,postgres]`:
    #   containers/apptainer-scitex.def (x2), containers/apptainer-base.def
    # plus docs/CHEATSHEET-fleet-todo.md naming `scitex-todo[mcp]`.
    #
    # Deleting the name first would not break those builds -- the dependencies
    # are core, so the install still gets everything, and an unknown extra is a
    # WARNING with exit 0. It would just start printing a warning in someone
    # else's build for a change of mine. Ordering it the other way costs nothing
    # and lands the noise on nobody.
    "django>=4.2",
    "scitex-app",
    "scitex-ui>=0.11.1",
]
mcp = [
    # Same redundant-alias contract as `web` above. FastMCP is the canonical
    # SciTeX MCP SDK (general skill §1) and is now a hard dependency: the MCP
    # server in `scitex_cards._mcp_server` is how every agent in the fleet
    # writes to the board, which is not an optional capability of this package.
    #
    # This is the alias the 2026-08-01 outage was pinned to. Keeping it
    # resolving, and now resolving to a COMPLETE install, is the point.
    #
    # Restated rather than left empty, per PS-214 -- see the `web` note above.
    "fastmcp>=2.0",
]
postgres = [
    # KEPT DELIBERATELY, THOUGH IT IS NOW REDUNDANT: psycopg was promoted to a
    # hard dependency (see `dependencies`), so this extra adds nothing.
    #
    # It stays because `scitex-cards[postgres]` is PINNED IN THINGS I DO NOT
    # CONTROL -- .github/workflows/postgres-backend-on-ubuntu-latest.yml, the
    # agent-container def files, and whatever else in the fleet copied that
    # string. Deleting an extra does not fail loudly; pip warns and continues,
    # so the breakage would be silent and would land on someone else. An empty
    # alias costs one line and keeps every existing pin resolving.
    #
    # Do not "clean this up" without first checking who still names it.
    #
    # ---- history, kept because it explains why the extra existed ----
    # THE CAPABILITY ALREADY WORKS AND WAS NEVER DECLARED. `_backend_connect`
    # reads a PostgreSQL store today -- verified against a real server
    # (PostgreSQL 18.4, database scitex_cards): the same query string, with
    # SQLite's `?` placeholders, returned the same 264 rows through both
    # backends because `_store_url.to_paramstyle` translates in transit.
    #
    # It worked only because psycopg happened to be present in the
    # environment where it was tried. Nothing in the package asked for it, so
    # a fresh `pip install scitex-cards` produces an install where the
    # PostgreSQL path raises ImportError -- a capability that is real, tested,
    # and unreachable by anyone who installs the package normally.
    #
    # `[binary]` bundles libpq rather than requiring system client libraries,
    # so this extra installs on a bare machine without a PostgreSQL install.
    #
    # SQLite remains the zero-config default and is NOT moved behind an extra:
    # the canonical store is SQLite, and a store you cannot open without an
    # optional dependency is not a default.
    "psycopg[binary]>=3.1",
]
currency = [
    # CURRENCY gate (operator directive: stale or broken installs ERROR, not
    # warn). `scitex_cards._currency.check_currency()` imports
    # `scitex_dev.staleness.ensure_current` — >=0.34.0 is the first release
    # that ships it.
    #
    # DELIBERATELY NOT PROMOTED TO CORE, though scitex-dev's agreed list said
    # to promote it. It fails the promotion test the other three passed.
    #
    # The test is "when this is missing, does the failure name itself?", and
    # `check_currency()` is a NO-OP when scitex-dev is absent -- there is no
    # failure to misattribute, which is the entire reason psycopg had to be
    # promoted. Promoting this would instead make a DEVELOPMENT toolchain a
    # hard dependency of every runtime install, breaking the decoupling rule
    # that lets scitex-cards stand alone.
    #
    # Raised with scitex-dev rather than decided unilaterally: if they want it
    # core anyway, the argument has to be something other than the test, and I
    # would rather hear it than guess it.
    "scitex-dev>=0.34.0",
]
all = [
    # EVERY RUNTIME EXTRA, AND NOTHING THAT NEVER SHIPS TO A RUNTIME.
    #
    # `dev` and `docs` were in here until 2026-08-02 and that single line caused
    # a fleet outage, by a route worth spelling out because it is not obvious.
    #
    # With pytest and sphinx folded into `all`, `[all]` looked expensive for a
    # container image. So the agent-container defs pinned a hand-picked subset
    # instead -- `scitex-cards[mcp]` -- which does not pull psycopg. Every agent
    # container then lost the store when it moved to PostgreSQL, and the error
    # blamed the database rather than the missing driver. Two agents spent a
    # round each in the wrong layer.
    #
    # Nobody chose a partial set because they wanted one. They chose it because
    # the safe option had been made costly HERE. Fixing this line removes the
    # motive rather than arguing against the choice, which is the only kind of
    # fix that survives someone with a plausible local reason -- and I am that
    # someone: I recommended `[mcp,postgres]` on size grounds one hour after
    # diagnosing this exact failure.
    #
    # Measured across the ecosystem (scitex-dev, 83 pyprojects): 51 packages
    # already exclude dev/docs from `all`, 28 include them. This package was in
    # the minority, so `[all]` being expensive was never a fact about `[all]` --
    # only about ours.
    #
    # CI is unaffected: both workflows that need the toolchain already ask for
    # it explicitly as `.[all,dev]` (quality-audit and pypi-publish), so the
    # PostgreSQL backend is still EXERCISED in CI rather than merely compiled.
    # dev/docs are BACK IN, and the reason is a live conflict rather than a
    # change of mind. I removed them, and scitex-dev's own shipped audit rule
    # rejected it:
    #
    #   [E] PS-221 §3 public-extra-not-closed-under-all: requirement `pytest` in
    #   PUBLIC extra `[dev]` is MISSING from the `all` extra. Policy: every
    #   public extra must be a SUBSET of `all` ... a public requirement absent
    #   from `all` silently under-installs.
    #
    # That is the exact opposite of the rule scitex-dev specified to me an hour
    # earlier ("`all` must NOT contain dev or docs"). Both rules are theirs, one
    # is enforced today, and I am not going to satisfy the unshipped one by
    # suppressing the shipped one -- a gate you route around stops being a gate.
    #
    # The conflict is real and the resolution is probably PEP 735 dependency
    # groups: dev/docs stop being EXTRAS at all, so PS-221 no longer reaches
    # them and `all` becomes runtime-only without contradicting anything. That
    # is also the mechanism the operator was reaching for when he asked for
    # underscore-prefixed groups -- PEP 508 forbids that spelling, PEP 735
    # provides the concept. Raised with scitex-dev; not decided here.
    #
    # So `all` keeps its current membership and this PR ships only the psycopg
    # promotion, which is the half that actually fixes the outage.
    "scitex-cards[dev,docs,mcp,web,currency,postgres]",
]

# BOTH console scripts resolve to the canonical `scitex_cards` CLI. The legacy
# `scitex-todo` binary MUST keep working through the transition window: the
# agent fleet invokes it today, and breaking it would cut every agent off from
# the task board.
[project.scripts]
scitex-cards = "scitex_cards._cli:main"
scitex-todo = "scitex_cards._cli:main"

# Repo renamed to scitex-ai/scitex-cards (2026-07-16); old URLs auto-redirect.
# Documentation stays on the scitex-todo RTD project until that console-side
# rename lands (tracked on the S2 migration card).
[project.urls]
Homepage = "https://github.com/scitex-ai/scitex-cards"
Repository = "https://github.com/scitex-ai/scitex-cards"
Issues = "https://github.com/scitex-ai/scitex-cards/issues"
Documentation = "https://scitex-todo.readthedocs.io"

# scitex_dev.* groups are ITERATED by scitex-dev (not looked up by key), so
# each registers the NEW key only — a legacy twin key would list the package
# twice (and `scitex_dev.jobs` would double-schedule every job).
[project.entry-points."scitex_dev.docs"]
scitex-cards = "scitex_cards"

[project.entry-points."scitex_dev.skills"]
scitex-cards = "scitex_cards"

# Federated scheduled-job aggregation. scitex-dev `ecosystem up`
# discovers this entry point and brings the declared JobSpec(s) up
# via `systemctl --user` (kind="service" / "timer") or the managed
# crontab block (kind="cron"). See src/scitex_cards/_jobs_provider.py.
[project.entry-points."scitex_dev.jobs"]
scitex-cards = "scitex_cards._jobs_provider:provide_jobs"

# DELIBERATELY NOT REGISTERED: `scitex_dev.store.plugins`.
#
# `scitex_cards._store_plugin` declares the card table's merge semantics, and
# that declaration lands as DOCUMENTATION first. Registering the entry-point
# group here is what makes the federation actually resolve and merge the live
# board, and several field rules are still open (`card_json` vs the columns it
# duplicates, `row_order`'s missing DERIVED role, `status`'s lack of a
# transition-aware rule). Wiring it before those are settled would put an
# admittedly incomplete declaration in charge of real data.
#
# So the module states the semantics and nothing calls it — which is exactly
# what its own docstring claims, and the claim has to stay TRUE. Add the block
# below only together with the decisions above:
#
#     [project.entry-points."scitex_dev.store.plugins"]
#     scitex-cards = "scitex_cards._store_plugin:provide"

# Hook-consumer entry-point contract (lead a2a `6fff33d6` +
# `fbffb879`, 2026-06-14, operator-mandated). External producers
# (SAC's push-hook, dev's merge-Action, future federated producers)
# register a callable plugin under this group. The dispatcher in
# `scitex_cards._hooks.dispatch_event` invokes every plugin for every
# event. Plugin signature:
#
#     def on_event(event: dict) -> None: ...
#
# See `scitex_cards._hooks` for the canonical event-payload spec and
# the built-in handlers (which run regardless of plugins).
# Standalone notification-DELIVERY channel registry (slice 1). The
# delivery loop (`scitex-todo deliver`) discovers channels registered
# under this group via importlib.metadata and hands each pending
# notification to the channels a user is configured for in
# recipients.yaml. Channel plugin = a class implementing the
# DeliveryChannel Protocol (attribute `name`, synchronous `deliver`).
# This group name is DELIBERATELY distinct from any
# `scitex_agent_container.*` group — scitex-todo's delivery rail is
# fully independent of sac (ZERO sac imports). See
# src/scitex_cards/_delivery/_registry.py.
[project.entry-points."scitex_cards.delivery_channels"]
log = "scitex_cards._delivery._channels.log:LogChannel"
telegram = "scitex_cards._delivery._channels.telegram:TelegramChannel"

[project.entry-points."scitex_cards.hooks"]
# scitex-todo's built-in handler is invoked DIRECTLY by
# dispatch_event (not via the plugin loop). External producers add
# their plugins under this group in their own pyproject.toml.

[tool.hatch.build.targets.wheel]
# `src/scitex_todo` is the deprecated import shim (re-exports scitex_cards);
# it ships in the wheel until the fleet cutover completes, then gets dropped.
packages = ["src/scitex_cards", "src/scitex_todo"]
# Bundle the Django app's non-Python assets (manifest, templates, built
# frontend) into the wheel so `scitex-todo board` works from a pip install.
artifacts = [
    "src/scitex_cards/_django/manifest.json",
    "src/scitex_cards/_django/templates/**/*",
    "src/scitex_cards/_django/static/**/*",
    # Agent-facing skills — read at runtime by `scitex-cards skills get/install`.
    "src/scitex_cards/_skills/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-p no:anyio` — DO NOT REMOVE WITHOUT READING THIS.
#
# The anyio pytest plugin is auto-loaded (anyio is a transitive dependency, so the
# plugin arrives whether we want it or not) and it HANGS THIS SUITE. Symptom:
# test__channel_size_guard.py runs 5 tests, then wedges FOREVER on the 6th, with no
# output, no error, and no traceback. It is a silent, indefinite hang — the worst
# possible failure mode in CI, because it looks like a slow runner rather than a bug.
#
# Cause: our async seams are driven by `asyncio.run()` INSIDE SYNC test functions (this
# repo has no pytest-asyncio). A sync test that creates and tears down its OWN event loop
# — twice, in one test body — collides with the plugin's session-level loop management,
# and the second `asyncio.run()` never returns.
#
# Proven by a single-variable experiment: the same file HANGS by default and passes
# 10/10 with `-p no:anyio`. Nothing else changed.
#
# Turning it off is free: NOTHING in this repo uses it. There is not one `pytest.mark.anyio`
# and not one `anyio_backend` fixture in tests/. The plugin is pure liability here — it is
# needed by no test and it wedges the suite. (anyio the LIBRARY is still used in
# `_mcp_channel.drain_once`; this disables only its pytest PLUGIN.)
#
# If you ever add a genuinely anyio-driven test, drop this flag and give that ONE mechanism
# ownership of the loop — do not let two things manage event loops in the same session.
# `-x` (fail-fast) — KEPT, but know what it does when you read a run: it stops at the
# FIRST failure, so a full-suite run silently TRUNCATES there and the output reads as
# "only one thing is broken" when more may be. That is intentional (a fast CI signal), not
# a bug — but do not mistake a truncated run for a clean one.
#
# `-q` — DELETED ON PURPOSE (2026-07-18); DO NOT RE-ADD. pytest's `-q` is ADDITIVE: any
# caller that passes its own `-q` — the obvious thing to do — then runs `-qq`, which
# SUPPRESSES the final summary line while the dots and `[100%]` still render. The result is
# a run that LOOKS healthy and reports NOTHING. Two agents destroyed real test evidence to
# exactly this in one night (a base rate, not carelessness), because the tool makes the
# obvious action silently eat the one artifact you use to decide whether to ship. Quiet is
# now OPT-IN: pass `-q` yourself when you want it; the default prints a summary you can trust.
addopts = "-x -p no:anyio"

[tool.coverage.run]
parallel = true
source = ["scitex_cards"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
