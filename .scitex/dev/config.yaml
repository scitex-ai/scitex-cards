# scitex-dev audit config — tracked so CI applies the same whitelist as local.
# Add root-whitelist entries here if a non-conventional top-level file is needed.

project-type:
  - pip

audit:
  # PS-103 root-whitelist. `stub/` is not junk and not scratch: it holds the
  # `scitex-cards` DEPRECATION STUB, a SEPARATE distribution published to PyPI
  # from the same tag as this package (see tests/test_stub_version_sync.py,
  # which pins the two versions together). The rule offers three remedies —
  # move into ./src/<pkg>/ (wrong: it is its own wheel, not part of ours),
  # move into ./.dev/ (wrong: it ships), or whitelist here. Whitelisting is
  # the correct one, and it is reviewed rather than blanket-suppressed.
  root-whitelist:
    dirs:
      - stub

  # Pre-approved rule skips (lead a2a `fb413fb038da49d1b18262b237385c33`,
  # 2026-06-12, PR #110 fix-forward). Each entry is a scitex-dev audit rule
  # code we accept as drift while a focused cleanup PR is queued.
  #
  # TWO KNOBS, deliberately, because the two audit surfaces honour different
  # ones (measured 2026-09-22: dropping `skip` resurfaced 235 PS-204 + 3
  # PS-140 + 3 PS-169 + PS-108/108b in `audit-project` while `skip-rules`
  # stayed declared):
  #   `audit.skip` (bare ids) — honoured ONLY by `audit-project`, silently.
  #     Left untouched for back-compat per
  #     scitex_dev/_cli/audit/_config/_skip_rules.py. This is what keeps the
  #     per-surface project gate green.
  #   `audit.skip-rules` (rule + written reason) — honoured by `audit-all`
  #     with a visible MASKED INVENTORY (per-rule counts + reasons). Same
  #     rules, same justifications, reason-carrying.
  # Keep both in sync until `audit-project` honours `skip-rules`; deleting
  # `skip` alone is NOT a no-op (see measurement above).
  skip:
    - PS-204
    - PS-140
    - PS-169
    - PS-108
    - PS-108b
  skip-rules:
    # PS-204 — `orphan-test-file`. The suite names tests by BEHAVIOUR
    # (test__deadline_never_notifies, test__a_comment_row_is_read_by_name…),
    # not by mirrored module, so most files under tests/scitex_cards/ have
    # no 1:1 counterpart under src/scitex_cards/ (235 at last count; the
    # "six tests" note it replaced named only the non-Python-surface ones).
    # Renaming the suite to the mirror convention is its own PR.
    - rule: PS-204
      reason: "orphan-test-file: suite names tests by behaviour, not mirrored module, so most files under tests/scitex_cards/ have no 1:1 counterpart under src/scitex_cards/; renaming the suite to the mirror convention is its own PR"
    # PS-140 — `cross-package-imports-test-missing`. The
    # tests/integration/test_cross_package_imports.py gate file lists
    # an older import set; needs a regeneration sweep.
    - rule: PS-140
      reason: "cross-package-imports-test-missing: tests/integration/test_cross_package_imports.py gate file lists an older import set; needs a regeneration sweep"
    # PS-169 — `hosted-runner-forbidden`. This rule offers NO exemption path:
    # its own message says "forbidden without exception" and the only remedy
    # it names is the self-hosted pool. So a per-rule skip WITH A WRITTEN
    # REASON is the sole lever available, and it is the one the constitution
    # section 2 prescribes ("one at a time, in a config file, each with a
    # written reason") — the thing it forbids is a blanket FLAG that silences
    # the whole run, which this is not.
    #
    # The rule's premise is superseded. It cites an operator mandate of
    # 2026-07-14; two CURRENT documents say the opposite:
    #   constitution section 4 — "CI defaults to GitHub-hosted runners" — and it
    #     cites THIS repo, 2026-07-31: four runners sharing one uv toolcache,
    #     seven failures across five PRs in an afternoon, the 14-30s vs 62-66s
    #     duration tell.
    #   the operator's mantra glossary, さいしーあいとういつ — same policy, same
    #     incident, same instruction to isolate toolcache per runner.
    #
    # Reported as dev-ps169-forbids-hosted-runners-policy-superseded-20260731 so
    # the RULE gets fixed; this entry is the bridge and should be deleted the
    # moment scitex-dev lands that.
    - rule: PS-169
      reason: "hosted-runner-forbidden: rule premise superseded — constitution section 4 defaults CI to GitHub-hosted runners (same incident/policy formerly recorded beside the PS-224 entries, now removed as stale); reported upstream as dev-ps169-forbids-hosted-runners-policy-superseded-20260731; delete when scitex-dev fixes the rule"
    # REMOVED 2026-09-22: PS-168 (`secret-env-prefix-missing`) is STALE —
    # verified silent under scitex-dev 0.60.2.dev25 AND 0.60.1 on this tree
    # (no finding with all suppressions disabled). The old note said cla.yml
    # uses GH_PERSONAL_ACCESS_TOKEN without the SCITEX_CARDS_ prefix; the
    # rule no longer fires here, so the entry was deleted rather than
    # migrated. Restore it if the rule ever fires again.
    # PS-108 — `src-prefix-cluster-mess`. INHERITED STRUCTURAL DEBT, not
    # drift introduced by any PR that currently trips it. Measured on
    # develop @ 951124bc: 12 prefix-clusters totaling 89 flat files
    # (`store_*` ×21, `db_*` ×11, `inbox_*` ×10, `dm_*` ×8, `health_*` ×8,
    # `mcp_*` ×8, `channel_*` ×5, `stale_*` ×5, `reminder_*` ×4,
    # `backend_*` ×3, `schema_*` ×3, `threads_*` ×3).
    #
    # The rule's own remedy is "land all clusters in one coherent refactor
    # pass", which is precisely what is tracked as
    # cards-group-the-store-db-dm-module-families-into-subpackages-20260810,
    # with PR #785 (`_dm/` subpackage) as step one. That refactor moves most
    # of the package and cannot be a precondition for unrelated work.
    #
    # DELETE THIS ENTRY WHEN THAT CARD LANDS. It is a bridge, not a verdict:
    # the debt is real and the rule is right about it.
    - rule: PS-108
      reason: "src-prefix-cluster-mess: inherited structural debt, not drift (12 prefix-clusters, 89 flat files @951124bc); tracked as cards-group-the-store-db-dm-module-families-into-subpackages-20260810 with PR #785 as step one; delete when that card lands"
    # PS-108b — `src-flat-py-files-over-threshold`. Same inherited debt,
    # same tracking card, same deletion condition. Measured on develop @
    # 951124bc: 133 flat .py files at `scitex_cards/` root against a
    # threshold of 15.
    #
    # This one additionally made the gate NON-DETERMINISTIC ACROSS UNRELATED
    # CHANGES, which is why skipping it is urgent rather than cosmetic. The
    # finding text carries the COUNT ("133 flat .py files"), and `--new-only`
    # keys findings by their rendered line, so ANY PR that adds or removes a
    # file at the package root rewrites the key: one finding out, one in,
    # net-new = 1, red. PR #785 REDUCES the count to 125 — real progress
    # toward the threshold — and is failed by this rule for making it. A gate
    # that a fix cannot pass is not measuring what it claims to.
    #
    # Same failure mode the quality-audit workflow header already documents
    # for tally-bearing summary lines; reported upstream so the KEYING gets
    # fixed. This entry is the bridge until then.
    - rule: PS-108b
      reason: "src-flat-py-files-over-threshold: same inherited debt, same tracking card, same deletion condition (133 flat .py files @951124bc vs threshold 15)"
    # REMOVED 2026-09-22: PS-128 (`sphinx-build-broken`) is STALE — verified
    # silent under scitex-dev 0.60.2.dev25 AND 0.60.1 on this tree (no finding
    # with all suppressions disabled), so the entry was deleted rather than
    # migrated. The old note argued the rule's premise (hatchling
    # `force-include` fails on gitignored dirs) does not hold for this
    # package's `artifacts`-based wheel docs, and that re-tracking
    # `_sphinx_html/` would restore the 2026-06-17..08-16 silent-push outage;
    # the release workflow still asserts on the BUILT WHEEL instead. None of
    # that changed — the rule simply no longer fires here. Restore the entry
    # (as `skip-rules`, with that reason) if it ever fires again.
    #
    # ── MIGRATION NOTE 2026-09-22 (the 2026-08-10..16 skip-vs-skip-rules
    # discussion was removed in this commit as resolved). The old note's demand — migrate only
    # when the `skip-rules` counters are verified — is met by this commit:
    # `audit-all` prints `N masked by skip-rules (N declared)` with per-rule
    # counts, and `--new-only` is gone from the quality gate (#909), so the
    # untested-wiring worry no longer applies to the path CI runs.
    # Lesson kept from the old note: verification notes carry a date, or
    # they outlive the code they describe.
    #
    # EVERY OTHER RULE STAYS LIVE, and that is the point of doing this
    # per-rule instead of reaching for a blanket flag. Those rules are
    # currently earning their keep: they caught PR #780's STX-TQ005 fixture
    # bug and PR #785's missing tests/scitex_cards/_dm/ mirror. Both are real
    # defects found by the gate that this entry keeps pointed at real work.

  # PER-SITE exemptions (`audit.exemptions`, {rule: [{path, line, reason}]}).
  # Deliberately NOT `skip-rules` above: a repo-wide skip silences a rule
  # everywhere, which for a rule like PS-224 would stop detecting ANY
  # workflow aimed at a runner no machine serves — and such a rule's whole
  # value is catching the green-by-absence case where a job never runs and
  # therefore never fails. Silencing it repo-wide to excuse one deliberate
  # exception is "a gate that cannot fail is not a gate" (constitution §2).
  # One site, one reason, still enforced everywhere else.
  exemptions:
    PS-231:
      # `workflow-duplication` — the rule says this workflow re-implements the
      # org reusable `rtd-sphinx-build` and should call it instead.
      #
      # CONVERTING IT WOULD DELETE THE ONLY THING IT STILL DOES. This workflow
      # no longer commits anything: the in-wheel docs are BUILT at release time
      # (pypi-publish-and-github-release-on-tag.yml) and carried by hatchling
      # `artifacts`. What remains is one job — `sphinx-build -W --keep-going`,
      # i.e. proving the docs build clean with warnings-as-errors — and that is
      # what gates the PR.
      #
      # PS-231's OWN TEXT NAMES THIS CASE: "Check the PR gate too: leaves that
      # run `sphinx-build -W` lose it, because the org build does not." So a
      # bare `uses:` here does not move the gate upstream, it removes it, and
      # leaves a green check standing where the gate used to be. That is the
      # constitution's "a gate that cannot fail is not a gate ... the same as
      # deleting it, except worse: the config still lists it and everyone
      # believes it is working."
      #
      # BLOCKER 2 DOES NOT APPLY and is recorded so nobody re-derives it: this
      # leaf does not vendor `_sphinx_html` back into the tree. That was true
      # once and caused the 2026-06-17..08-16 outage documented in the
      # `skip-rules` removal note above; the commit-and-push step is gone,
      # deliberately.
      #
      # REVISIT WHEN: the org reusable grows warnings-as-errors, at which point
      # the gate moves upstream honestly and this entry should be deleted.
      - path: .github/workflows/rtd-sphinx-build-on-ubuntu-latest.yml
        line: 0
        reason: >-
          Converting to the org reusable would DELETE this workflow's only
          remaining job — `sphinx-build -W`, the warnings-as-errors PR gate —
          because the org build does not run it, a loss PS-231's own remedy
          text warns about. Nothing is vendored back into the tree here
          (BLOCKER 2 does not apply; the commit-and-push step was removed after
          it caused a two-month silent-failure outage). Delete this entry once
          the org reusable enforces warnings-as-errors itself.
      # `workflow-duplication` on the renamed (PS-165-neutral) quality gate.
      # This workflow runs THIS package's canonical
      # `scitex-dev ecosystem audit-all scitex-cards` gate with leaf trigger
      # paths (src/tests/pyproject/config + itself) and documents the leaf's
      # gate history (`--new-only` removal #909). Converting it to the org
      # caller renames the published check context `<job>` →
      # `<caller-job> / <callee-job>` (BLOCKER 1 in PS-231's own text), which
      # needs branch-protection coordination — a separate change, not part of
      # an audit-green run. Revisit then.
      - path: .github/workflows/quality-audit-on-ubuntu-latest.yml
        line: 0
        reason: >-
          Leaf-specific audit-all gate for this package (leaf trigger paths
          and gate history documented in-file); converting to the org caller
          renames the required check context per BLOCKER 1, which needs
          branch-protection coordination done as its own change.

  # REMOVED 2026-09-22 (kept as comment so the parser never sees it):
  # PS-128 RECORD ONLY entry deleted as stale (the rule is verified silent
  # under scitex-dev 0.60.2.dev25 AND 0.60.1; see the `skip-rules` removal
  # note above for the retained history).
  # PS-224 both per-site entries deleted as stale (the rule is verified silent
  # under scitex-dev 0.60.2.dev25 AND 0.60.1 on this tree, with all
  # suppressions disabled). The old notes recorded deliberate runner choices
  # — cla.yml::CLAssistant kept off the credential-holding self-hosted runner
  # by a090c283 (#496, third-party action), and quality-audit::audit on hosted
  # for runner reliability (constitution section 4, uv-toolcache race). None of
  # that changed; the rule simply no longer fires here. Restore these entries
  # (same paths, same reasons) if it ever fires again — do NOT "fix" it by
  # repointing either job.
