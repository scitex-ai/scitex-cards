name: postgres-backend
# The canonical store for this deployment is PostgreSQL, and until this file
# existed NO CI leg ever connected to one. Every Postgres-specific behaviour —
# the null-safe operator split, paramstyle translation, plpgsql trigger
# substitution, advisory-lock semantics, dict-like row access — was validated
# only on developer machines.
#
# This is a REPO-LOCAL workflow on purpose. The pytest matrix is an org-level
# reusable workflow (scitex-ai/.github) shared by every repository, so adding a
# service container there would impose a Postgres on repos that do not want one.
#
# WHY IT IS NOT ENOUGH TO SIMPLY ADD A SERVICE: a Postgres-only test does not
# FAIL without a server, it SKIPS, and a skipped test is indistinguishable from
# a passing one in a green summary. So this job EXPORTS SCITEX_CARDS_TEST_PG_DSN,
# which flips the fixtures from "skip if absent" to "fail if unreachable". Adding
# the service without that switch would buy a green leg and no assurance.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: postgres-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres-backend:
    runs-on: ubuntu-latest

    # THE FILE LIST IS DISCOVERED, NOT MAINTAINED. It was a hand-written allowlist
    # here, carrying its own warning that a Postgres-dependent test not on the
    # list "does not fail — it simply never runs in CI, which is this workflow's
    # own failure mode reappearing one level up."
    #
    # That is what happened. Measured 2026-08-23: SEVEN files declared
    # SCITEX_CARDS_TEST_PG_DSN and FIVE were listed; test__db_foreign_keys and
    # test__inbox_shape had never run against a server. And the defect that made
    # every commented card read-only fleet-wide that day — positional access on a
    # dict row, a behaviour THIS FILE'S HEADER NAMES BY NAME — shipped green,
    # because the card-write funnel had no Postgres-backed test to be omitted
    # from at all.
    #
    # A registry that must be remembered is not a mechanism. Discovery keys on
    # the marker this job already switches on, so a new Postgres test is included
    # by being written, and the empty-set refusal below turns a renamed marker
    # into a loud failure instead of a green run over zero files.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scitex_cards
          POSTGRES_PASSWORD: scitex_cards
          POSTGRES_DB: scitex_cards
        ports:
          - 5432:5432
        # Without a health check the steps race the server's startup and fail
        # with a connection error that looks exactly like a real defect.
        options: >-
          --health-cmd "pg_isready -U scitex_cards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package with the postgres extra
        run: |
          python -m pip install --upgrade pip
          # scitex-dev IS REQUIRED NOW, and its absence is not a soft one:
          # tests/conftest.py imports `scitex_dev.store.testing` at import
          # time for the ephemeral-schema affordance every test's store is
          # carved from. Without it the harness has no store to pin and
          # refuses (correctly) rather than falling back to the live board,
          # so the whole leg errors with a message about scitex-dev.
          python -m pip install -e ".[postgres]" pytest "scitex-dev>=0.57.0"

      - name: Confirm psycopg is importable
        # A missing driver would otherwise surface as a fixture failure whose
        # message blames the connection. Naming it here keeps the later failure
        # honest about what actually broke.
        run: python -c "import psycopg; print('psycopg', psycopg.__version__)"

      - name: Confirm the suite collects, and refuse a run over zero tests
        # THE EMPTY-SET REFUSAL IS STILL THE LOAD-BEARING HALF; what it guards
        # changed. This step used to SELECT the "Postgres-dependent" files by
        # grepping for a marker, because most of the suite did not touch a
        # server. Every test touches one now -- the harness gives each its own
        # throwaway schema -- so a marker-selected subset is not a subset of
        # anything any more, and the honest scope is the whole suite.
        #
        # The threshold is deliberately coarse. Pinning an exact count is the
        # mistake the assertion further down already records making: a number
        # calibrated to one file's total goes stale the moment a test is added.
        # "Thousands, not a handful" is the property that stays true.
        run: |
          set -euo pipefail
          n=$(python -m pytest tests --collect-only -q 2>/dev/null | tail -1 \
                | grep -oE '^[0-9]+' || true)
          if [ -z "$n" ] || [ "$n" -lt 1000 ]; then
            echo "::error::the suite collected ${n:-0} tests -- expected thousands. Collection is broken, and a run over a truncated set reports success for a suite that never ran."
            exit 1
          fi
          echo "collected=$n"

      - name: Run the Postgres-backed tests
        env:
          # THE VARIABLE THE HARNESS ACTUALLY READS. `SCITEX_CARDS_TEST_PG_DSN`
          # was this package's own private marker and is gone: the fixtures that
          # keyed on it skipped whenever it was unset, which was always, so they
          # reported green without opening a connection. The store now comes
          # from `scitex_dev.store.testing.writable_dsn()`, whose first route is
          # $SCITEX_STORE_DSN -- and it probes `pg_is_in_recovery()` rather than
          # assuming, so a standby is rejected instead of silently refusing DDL.
          SCITEX_STORE_DSN: postgresql://scitex_cards:scitex_cards@127.0.0.1:5432/scitex_cards
        run: |
          # pipefail is NOT on by default -- GitHub runs `bash -e {0}`, so in a
          # pipeline only the LAST command's status survives. Without this the
          # `| tee` below returns 0 even when the tests fail, and the step passes
          # while they are red. (A command that never ran reporting success is
          # the same class of defect this whole workflow exists to remove;
          # credit to scitex-hpc, who measured it on three commands piped to
          # `head` the same day this was written.)
          set -o pipefail
          # NOT `-x`. The repo's addopts carry exitfirst, which is right for a
          # developer loop and wrong for a MEASURING gate: it stops at the
          # first failure, so the log reports a number describing where it gave
          # up rather than the state of the suite. Overridden here so this leg
          # answers "how many pass" instead of "how far did it get".
          python -m pytest tests -q -rs \
            --override-ini="addopts=-p no:anyio" | tee result.txt

      - name: Assert the Postgres tests actually exercised Postgres
        # The guard on the guard. A leg that is green because every Postgres
        # test SKIPPED proves nothing, which is the precise failure this
        # workflow exists to remove.
        #
        # Asserts an INVARIANT, not a count. An earlier version pinned
        # `passed >= 7`, calibrated to one file's test total -- a number
        # guaranteed to go stale the moment a test is added, which happened
        # within the hour when the carry tests landed. The durable property is
        # that NO test skipped for want of a Postgres, and that something ran.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("result.txt").read_text()

          # A declared-but-broken DSN now FAILS in the fixture, so these strings
          # should be impossible here. Checking anyway: if the fixture ever
          # regresses to skipping, this leg must not stay green.
          for marker in (
              "No writable PostgreSQL is available",
              "scitex_dev.store.testing is not importable",
              "no live Postgres",
              "psycopg not installed",
          ):
              if marker in text:
                  print(f"ERROR: a test skipped for want of Postgres: {marker!r}")
                  sys.exit(1)

          m = re.search(r"(\d+) passed", text)
          passed = int(m.group(1)) if m else 0
          print(f"passed={passed}")
          if passed < 1:
              print("ERROR: no tests passed -- the suite did not run")
              sys.exit(1)
          PY
