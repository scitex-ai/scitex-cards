name: tests
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/concurrency preserved verbatim from the prior local file.
# New required-status-check context: "pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>"
# NOTE: the prior local job set `strategy.max-parallel: 1` (scitex-cards has
# only 3 dedicated spartan-cpu runners; unbounded parallel matrix legs
# saturate the pool and starve other PRs/workflows) and used
# `continue-on-error: true` + an isolated HOME on the Codecov upload step
# (self-hosted-runner ~/.gitconfig race mitigation). The reusable
# pytest-matrix.yml has neither — accepted per the centralization goal
# (Codecov upload already has `fail_ci_if_error: false` in both versions,
# so it cannot fail the job either way); flagged in the migration PR/report
# as a runner-pool-saturation risk worth reintroducing upstream if it bites.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit
    with:
      # RUNNER: whatever `vars.CI_RUNS_ON` says, falling back to GITHUB-HOSTED
      # `ubuntu-latest` when that variable is unset — so this line is inert
      # wherever nobody set it. It previously read the literal
      # `'["ubuntu-latest"]'`, which meant the repository variable pointing CI
      # at our own hardware was written and then IGNORED: the write was
      # verified, the EFFECT was not, and a rerun still landed on "GitHub
      # Actions 1000048594" after 16m57s. The callee's `runs_on` input is a
      # STRING that it passes through `fromJSON` itself, so it must NOT be
      # wrapped in `fromJSON` here.
      #
      # THE CAUTION BELOW STILL STANDS — BUT IT IS SPARTAN-SPECIFIC.
      # Operator ruling 2026-07-31 made GitHub-hosted the default here: this
      # repository is public so the minutes are free, our machines are not
      # faster for a pure-Python matrix that finishes in about a minute, and
      # the Spartan pool had a measured hazard. Every runner on the SPARTAN
      # lease inherits ONE mutable ~/.runner-toolcache on GPFS, so runners
      # contend for a single directory and jobs fail BOTH reading it
      # (`uv: No such file` -> exit 127) and writing it (ENOENT during copy).
      # Measured here 2026-07-31: seven failures across five pull requests in
      # one afternoon, four differently-named runners, every one cleared by a
      # plain rerun.
      #
      # What is now known: OUR OWN POOL CANNOT HIT IT. Label `scitex-org-cpu`
      # (hosts compute-01/03/04) gives each host its own LOCAL home — verified
      # 2026-08-31 by writing a marker file under ~ on compute-04 and finding
      # it ABSENT on 01 and 03 while the same read succeeded locally. So
      # honouring the variable is safe AS LONG AS THE VARIABLE DOES NOT POINT
      # AT `spartan-cpu`. If it ever does, the toolcache race is back and this
      # should be pinned to the literal again until every Spartan runner has
      # its own AGENT_TOOLSDIRECTORY.
      #
      # DIAGNOSING A TOOLCACHE FAILURE — USE THE EXIT CODE, NOT THE DURATION:
      #   exit 127 -> the toolcache race; uv died before anything ran
      #   exit 1   -> something ran and genuinely failed. Read the log.
      #
      # This file previously taught "failures finish in 14-30s where passing
      # legs take 62-66s". That tell is a PER-REPO CALIBRATION, not a fleet
      # constant, and it cost scitex-hpc a wrong call on 2026-08-02: on a repo
      # whose suite is ~9s, green runs measure 17/31/25/26s and red runs
      # 17/32/26/27s — indistinguishable. Only one direction is mechanism-level
      # and safe to reuse: a LONG run cannot be the toolcache race, because a
      # uv that never installed cannot produce 300s of work.
      #
      # Worse, the duration tell cannot accumulate evidence about itself. Its
      # prescribed action is `rerun`, and `gh run list` reports only the LATEST
      # attempt — so the rerun deletes the failure you would need to check
      # whether the rule was ever right. Verified here 2026-08-02: a release
      # failure watched live now reads `attempt=2, conclusion=success`, with
      # 25/25 recent runs green and the failure nowhere in the list.
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}

      # THE STORE IS A POSTGRESQL DATABASE, so this leg needs one or it is not
      # testing this package. The three contexts this input flips are the
      # REQUIRED ones; `postgres-backend`, which has always had a server, is
      # not. So until now the gate that blocks a merge could not see the thing
      # the store conversion changed.
      #
      # WITHOUT IT THE LEG DOES NOT SKIP — IT REFUSES, WHICH IS WHY THIS IS A
      # FIX AND NOT A NEW FEATURE. tests/conftest.py pins $SCITEX_CARDS_DB to a
      # target the source doors reject when no cluster could be opened, so every
      # store-touching test fails loudly rather than passing over nothing.
      # Measured on this leg, run 33290762754 (py3.12), the report header said:
      #
      #   scitex-cards store: NO WRITABLE POSTGRESQL WAS OPENED -- every
      #   store-touching test will refuse.
      #     reason: TimeoutExpired: Command '[.../pg_ctl, -D,
      #     /tmp/scitex-store-test-azpl2pf9/data, ...]' timed out after 120s
      #
      # That is `scitex_dev.store.testing.writable_dsn()` falling through to its
      # LAST route — start a private cluster with initdb/pg_ctl — and hanging
      # there. (`pg_ctl start` is captured with `capture_output=True` and no
      # `-l`, so the daemonised postmaster inherits the pipe and holds it open
      # past pg_ctl's own exit; the read blocks until the 120s timeout. That is
      # a scitex-dev defect, reported separately.) Declaring a server takes
      # route ONE instead — `$SCITEX_STORE_DSN` — so the broken route is never
      # reached.
      #
      # NO NAME MAPPING IS NEEDED, and I checked rather than assuming, because
      # the org workflow's own comment warns that scitex-cards gates on a
      # private marker. On DEVELOP that is true. On THIS branch it is not:
      # tests/conftest.py:86 sets `_STORE_DSN_ENV = "SCITEX_STORE_DSN"` and
      # tests/conftest.py:125-134 opens the session store through
      # `scitex_dev.store.testing.writable_dsn()`, whose first route is that
      # same variable (scitex_dev/store/_host.py `STORE_DSN_ENV`). The reusable
      # workflow exports exactly that name, so ONE name is the source of truth
      # and there is no second one to disagree with it — which is the property
      # worth having here, given this repo lost its live board on 2026-07-19 to
      # two names that resolved differently.
      postgres: true
