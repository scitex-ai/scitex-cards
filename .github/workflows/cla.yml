name: CLA Assistant

# Org-level reusable-workflow caller (scitex-ai/.github, fleet standard).
#
# Operator ruling 2026-08-15: "cla must be handled via the shared workflow which
# is set for the organization, scitex-ai" / "you must not re-invent that" /
# "github workflows must follow the organizations ones unless leaf package's
# version is really unique to the leaf". Nothing about a CLA is unique to
# scitex-cards, so this file delegates.
#
# THIS IS A SECURITY IMPROVEMENT, NOT A TIDY-UP, and that is worth stating
# because the inline version it replaces carried a long comment block defending
# its own arrangement. Both of that block's concerns are answered BETTER here:
#
#   1. THIRD-PARTY CODE. The inline version called `contributor-assistant/
#      github-action`, an UPSTREAM third party, on an attacker-triggerable
#      trigger (`pull_request_target` + `issue_comment` — anyone may open a PR
#      or comment) while holding a personal access token. The org reusable calls
#      `scitex-ai/github-action@114064ad` — the ORG-OWNED FORK, at a fixed SHA.
#      Same pinning discipline, but the code being pinned is ours.
#   2. RUNNER CHOICE. The inline version hard-coded `runs-on: ubuntu-latest` with
#      a paragraph explaining why this one job is a deliberate exception to the
#      self-hosted rule (a persistent runner's $HOME holds fleet credentials; a
#      stranger's trigger must not run beside them). The reusable takes `runs_on`
#      as an INPUT defaulting to '["ubuntu-latest"]', so the same decision holds
#      and is now the org's to change once rather than ours to re-defend here.
#
#      THAT PARAGRAPH WAS NOT TRUE OF THE SHA IT SHIPPED WITH. At `ecb0345b`
#      the reusable had no `runs_on` input at all: both jobs hard-coded
#      `runs-on: [self-hosted, Linux, X64, spartan-cpu]`. So this file claimed
#      to have preserved the inline version's ubuntu-latest decision while
#      actually reversing it, and the delegation quietly moved an
#      outsider-triggerable job ONTO the credential-bearing pool. The bump to
#      `8da375a9` is what makes the paragraph above describe reality: the input
#      exists and defaults to '["ubuntu-latest"]', so passing nothing now lands
#      on a disposable hosted VM. Verify before trusting a comment about a
#      pinned callee — the pin is what decides, not the prose beside it.
#
# WHY THE `uses:` REF IS A SHA, NOT `@main`
# -----------------------------------------
# A mutable org-level ref means one change to the reusable lands in EVERY calling
# repo at once with no review in any of them — and this workflow runs on
# `pull_request_target` with a PAT. Pinning the SHA keeps the blast radius of an
# org-level edit to the repos that deliberately re-pin. Matches scitex-dev.
#
# THE DEFECT THIS ALSO FIXES: the inline version wrote signatures to a
# `cla-signatures` branch in THIS repo, and that branch has never existed --
# measured 2026-08-15, `git ls-remote --heads origin cla-signatures` is empty.
# So the gate could REFUSE a contributor but could never RECORD one accepting:
# the "comment to sign" instruction it posted could not succeed. A per-repo
# ledger was the wrong shape; the org owns one.
#
# Card: cards-cla-gate-has-no-branch-to-write-signatures-to-20260815

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@f5d19f5b7424fcf985137bb6acff54f5d0e11749 # main@2026-08-30
    with:
      # Preserved verbatim from the inline version this replaces.
      owner_allowlist: "bot*,ywatanabe1989"
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
