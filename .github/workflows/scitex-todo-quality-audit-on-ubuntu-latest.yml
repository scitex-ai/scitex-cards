name: quality

# Single-package quality gate — runs `scitex-dev ecosystem audit-all`
# against this package. Mirrors the canonical audit that
# `tests/develop/test_audit.py` runs inside the test suite, but as a
# standalone gate so an audit regression is visible even when the matrix
# is skipped.
#
# `--new-only` is the key flag: this package carries a known body of
# pre-existing findings that are being retired in their own focused PRs.
# `--new-only` diffs against the base ref (default `develop`) and reports
# ONLY net-new violations, so the existing backlog is ratcheted as the
# baseline (0 net-new -> GREEN) while still failing CI the instant a NEW
# violation is introduced. Project-type + rule skips live in
# `.scitex/dev/config.yaml` in this checkout and are applied automatically.
#
# THE DISTRIBUTION ARGUMENT IS `scitex-cards`, AND IT USED TO BE WRONG.
# It passed `scitex-todo` — the pre-rename name — so the auditor evaluated
# this tree against a package layout that does not exist here, and every
# project-structure finding demanded the OLD shape: PS-105 "missing
# scitex_todo/__main__.py", PS-201 "missing tests/scitex_todo/ parent",
# PS-302 "rename tests/scitex_cards/ to tests/scitex_todo/scitex_cards/",
# PS-203 x9 loose top-level. Findings about a package that is not here.
#
# That was not merely noise, it made the gate NON-DETERMINISTIC ACROSS
# UNRELATED CHANGES. Those findings roll up into a summary line
#
#     ERRO: scitex-todo (<abs path>): project-structure: 14 error(s), 56 warning(s), 4 info
#
# whose subject carries a parenthesised path, which `_FINDING_RE` in
# scitex-dev's `_cli/audit/_diff.py` cannot match. It therefore falls
# through to the ERRO fail-open and is keyed by the WHOLE LINE — counts
# included. Adding one markdown file under `docs/adr/` moved `4 info` to
# `6 info`, which swapped that key: one out, one in, totals unchanged.
# The gate reported "1 net-new finding" against "131 at HEAD (131 at
# baseline)" and stayed red across a re-run of the identical commit,
# because it was deterministic rather than flaky. Diagnosed with
# scitex-dev 2026-08-02; they are fixing the keying itself so a tally can
# never be attributed. Auditing the distribution that actually exists is
# this repo's half, and it is correct independently of that fix.
#
# Runner: scitex-todo's self-hosted Spartan CPU runners
#   (spartan-cpu-todo-01 / -02). GitHub-hosted `ubuntu-latest` is
#   unavailable on this account (Actions billing block), and todo runs
#   ALL compute on the dedicated Spartan runners anyway. The
#   `-on-ubuntu-latest` filename is kept for fleet naming consistency
#   (cf. scitex-io / scitex-app / scitex-plt); it is a naming convention,
#   not a runtime assertion — same as rtd-sphinx-build-on-ubuntu-latest.
#   `actions/setup-python` has no tool cache on a self-hosted runner, so
#   `uv` provisions the interpreter and the venv.

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC (~03:00 JST), after the test run
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".scitex/dev/config.yaml"
      - ".github/workflows/scitex-todo-quality-audit-on-ubuntu-latest.yml"
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml

      - name: Fetch develop ref for --new-only baseline
        run: git fetch origin develop:develop || true

      - name: Install package + audit tooling
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          # ADR-0005: dev is a PEP 735 dependency GROUP, not an extra, so it is
          # requested with --group rather than with a bracket. `.[all]` is every
          # runtime capability; --group dev adds the toolchain. The fallbacks
          # degrade to less, never to something that silently omits a runtime
          # capability, which is the failure this ADR exists to prevent.
          uv pip install --python .venv/bin/python -e ".[all,dev]" \
            || uv pip install --python .venv/bin/python -e ".[all]" \
            || uv pip install --python .venv/bin/python -e .
          # ASSERT THE OUTCOME, DO NOT TRUST THE CHAIN. The last rung above always
          # succeeds, so a missing toolchain would surface one step later as a
          # pytest argument error that reads like a config problem. Measured on
          # #757: three legs died on `unrecognized arguments: --cov=...`.
          .venv/bin/python -c "import pytest, pytest_cov" || {
            echo "TOOLCHAIN INCOMPLETE after install: pytest and pytest-cov must both import." >&2
            echo "  dev is a PEP 735 group (ADR-0005): add --group dev" >&2
            exit 1
          }
          uv pip install --python .venv/bin/python "scitex-dev[cli-audit]>=0.17.14"

      - name: Run scitex-dev ecosystem audit-all (net-new only)
        # .venv/bin on PATH so the auditor's `shutil.which("scitex-dev")`
        # and the per-auditor subprocess spawns resolve to THIS venv
        # (where scitex-todo's console-script is installed).
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          scitex-dev ecosystem audit-all scitex-cards --path "$PWD" --new-only --no-version-check
