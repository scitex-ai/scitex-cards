name: docs

# Builds the Sphinx docs with warnings-as-errors so a broken docstring,
# cross-reference, or toctree entry fails the PR before it can reach Read
# the Docs. Mirrors the RTD build (docs/sphinx/conf.py).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# `contents: read`, downgraded from `write` in the same change that removed the
# commit-and-push step below. The write scope existed ONLY for that push, which
# branch protection refused anyway — so this workflow has been holding a
# permission it could not use. Nothing here writes to the repository now.
permissions:
  contents: read

jobs:
  rtd-sphinx-build-on-ubuntu-latest:
    # THE POOL IS A VARIABLE, AND ITS DEFAULT MUST BE A POOL THAT EXISTS.
    # This job hard-coded `[self-hosted, scitex-ci]`. Every runner carrying
    # `scitex-ci` was offline on 2026-08-13 (spartan-cpu-org-01/-02/-03 and
    # spartan-pooled-cpu-01, all `status=offline`), while four
    # `scitex-org-cpu` runners sat `online` and `busy=false`. A job whose
    # label nobody carries does not fail — it QUEUES, beside idle machines,
    # and a required check that never starts is missing from the rollup
    # rather than red. #830 sat unmergeable for 47 minutes that way, with
    # every other check green.
    #
    # `vars.CI_RUNS_ON` is the escape hatch the release workflow in this repo
    # already uses, so pointing the repo back at Spartan when it returns is a
    # variable change rather than a PR. What changes here is the DEFAULT:
    # `ubuntu-latest`, which the audit, postgres-backend, pytest-matrix and
    # cla jobs in this same repo all ran on successfully the same day.
    #
    # The uv-managed Python below is unaffected: it was introduced because
    # self-hosted runners have no setup-python tool cache, and it works on
    # hosted runners too.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.12 (uv-managed)
        # self-hosted runners have no actions/setup-python tool cache, so
        # setup-python@v5 can't download an interpreter ("3.12 ... not found").
        # uv provisions Python the same way the pytest matrix jobs do.
        run: uv python install 3.12
      - name: Create uv venv
        run: uv venv --python 3.12 .venv
      - name: Install package + docs deps
        run: |
          uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python -r docs/sphinx/requirements.txt
      - name: Build HTML (warnings as errors)
        run: |
          .venv/bin/python -m sphinx -b html -W --keep-going \
            docs/sphinx docs/sphinx/_build/html
      # THE REFRESH STEP THAT USED TO LIVE HERE IS GONE. It built the HTML,
      # committed 99 files to develop, and pushed — which cannot succeed,
      # because develop is protected and requires a pull request plus 6 status
      # checks. Measured on run 31945230744 (2026-08-16):
      #
      #   remote: error: GH006: Protected branch update failed for refs/heads/develop.
      #    ! [remote rejected] develop -> develop (protected branch hook declined)
      #   push rejected (branch moved); skipping refresh commit
      #
      # Three things hid it: `git push || echo` turned the rejection into exit
      # 0, `continue-on-error: true` would have swallowed it regardless, and
      # the step's own conclusion was "success". The last refresh that actually
      # landed was 2026-06-17 — two months of green runs producing nothing, and
      # the package missing from https://scitex.ai/apps/docs/ the whole time.
      #
      # The message was the worst part: "branch moved" describes a race that
      # was not happening, so anyone who read it went looking for the wrong
      # bug. An actionable hint that points at the wrong cause is worse than no
      # hint, because it survives review.
      #
      # The in-wheel docs are now BUILT at release time (see the "Build docs
      # into the package" step in pypi-publish-and-github-release-on-tag.yml)
      # and carried by hatchling `artifacts`. Nothing is committed, so this
      # workflow keeps only the job it can actually do: proving the docs build
      # clean with warnings-as-errors, above, which gates the PR.
      #
      # DO NOT reintroduce a commit-and-push here without first changing the
      # branch protection — the failure is structural, not intermittent.