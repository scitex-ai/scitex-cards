name: docs

# Builds the Sphinx docs with warnings-as-errors so a broken docstring,
# cross-reference, or toctree entry fails the PR before it can reach Read
# the Docs. Mirrors the RTD build (docs/sphinx/conf.py).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rtd-sphinx-build-on-ubuntu-latest:
    # THE POOL IS A VARIABLE, AND ITS DEFAULT MUST BE A POOL THAT EXISTS.
    # This job hard-coded `[self-hosted, scitex-ci]`. Every runner carrying
    # `scitex-ci` was offline on 2026-08-13 (spartan-cpu-org-01/-02/-03 and
    # spartan-pooled-cpu-01, all `status=offline`), while four
    # `scitex-org-cpu` runners sat `online` and `busy=false`. A job whose
    # label nobody carries does not fail — it QUEUES, beside idle machines,
    # and a required check that never starts is missing from the rollup
    # rather than red. #830 sat unmergeable for 47 minutes that way, with
    # every other check green.
    #
    # `vars.CI_RUNS_ON` is the escape hatch the release workflow in this repo
    # already uses, so pointing the repo back at Spartan when it returns is a
    # variable change rather than a PR. What changes here is the DEFAULT:
    # `ubuntu-latest`, which the audit, postgres-backend, pytest-matrix and
    # cla jobs in this same repo all ran on successfully the same day.
    #
    # The uv-managed Python below is unaffected: it was introduced because
    # self-hosted runners have no setup-python tool cache, and it works on
    # hosted runners too.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.12 (uv-managed)
        # self-hosted runners have no actions/setup-python tool cache, so
        # setup-python@v5 can't download an interpreter ("3.12 ... not found").
        # uv provisions Python the same way the pytest matrix jobs do.
        run: uv python install 3.12
      - name: Create uv venv
        run: uv venv --python 3.12 .venv
      - name: Install package + docs deps
        run: |
          uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python -r docs/sphinx/requirements.txt
      - name: Build HTML (warnings as errors)
        run: |
          .venv/bin/python -m sphinx -b html -W --keep-going \
            docs/sphinx docs/sphinx/_build/html
      - name: Refresh in-wheel _sphinx_html (main/develop only)
        if: github.event_name == 'push'
        run: |
          rm -rf src/scitex_todo/_sphinx_html
          cp -rf docs/sphinx/_build/html src/scitex_todo/_sphinx_html
          # scitex-cloud serves docs from this in-wheel dir (PS-121).
          if [ -n "$(git status --porcelain src/scitex_todo/_sphinx_html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/scitex_todo/_sphinx_html
            # The commit-message marker keeps this from triggering itself.
            git commit -m "docs(build): refresh _sphinx_html [skip-docs-rebuild]"
            git push || echo "push rejected (branch moved); skipping refresh commit"
          else
            echo "_sphinx_html already current."
          fi
        continue-on-error: true