name: release

# Tag-driven release pipeline — SELF-HOSTED (Spartan CPU) via uv.
#
# The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest in a uv-provisioned venv. Must pass or
#                      the pipeline halts; nothing is published until tests
#                      are green on the tagged commit.
#   2. build         — wheel + sdist via `uv build`, uploaded as artifact.
#   3. publish       — PyPI via MANUAL OIDC trusted publishing, twine running
#                      on a uv-provisioned python.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#
# develop→main promotion is a DELIBERATE, separate PR (operator policy);
# this pipeline never auto-syncs main.
#
# WHY uv, not the SIF (2026-07-11): this pipeline used to apptainer-exec the
# shared ci-cpu.sif because the bare Spartan nodes have no Python tool cache.
# That SIF vanished from the runner host
# (incident-ci-sif-vanished-release-blocked-20260711) and took every repo's
# release down with it — a single unmanaged file as fleet-wide SPOF. The
# rationale was already obsolete: the org-level pytest-matrix reusable
# workflow (scitex-ai/.github) provisions Python on these SAME runners with
# astral-sh/setup-uv (uv downloads a standalone CPython), green since the
# 2026-07-10 migration. This pipeline now uses the identical mechanism, so
# test/build/publish depend on nothing but the checkout and uv:
#   - publish still CANNOT use pypa/gh-action-pypi-publish (a Docker action;
#     the compute nodes have no Docker), so the MANUAL OIDC trusted publishing
#     survives verbatim in .github/ci/publish-with-uv.sh: GitHub OIDC JWT →
#     PyPI mint-token → twine upload. Trust config on PyPI is unchanged
#     (it keys on owner/repo/workflow-file, none of which change).
#   - actions/checkout, upload/download-artifact, softprops release are JS
#     actions and run fine on the self-hosted runner.
# fail-loud: a missing interpreter/artifact is a HARD error, never a silent
# fallback.
#
# runs-on driven by repo Actions Variable CI_RUNS_ON (same as before).
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging. NOTE:
# workflow_dispatch executes THIS FILE from the default branch against the
# given tag — which is exactly how the stranded v0.8.0 gets published after
# this conversion merges.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # uv-provisioned test run — the exact install+pytest mechanism of the
      # org-level pytest-matrix reusable workflow, proven green on these same
      # spartan-cpu runners (uv downloads a standalone CPython; nothing is
      # needed on the bare node).
      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml
      # MIRROR the org pytest-matrix reusable workflow's invocation EXACTLY —
      # including the coverage flags and the package-derived --cov path. Not
      # cosmetic: a simplified `pytest tests/` here selected a different plugin
      # set and test order, and test_priority_endpoint_invalidates_cache_for_
      # second_node failed under it while pytest-matrix was green on the SAME
      # commit (v0.8.1's first run: 744 passed, 1 failed). Copying a proven
      # mechanism means copying it, not paraphrasing it.
      - name: Run tests in a uv venv (deps provisioned, not on the bare runner)
        run: |
          set -euo pipefail
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]" \
            || uv pip install --python .venv/bin/python -e ".[dev]" \
            || uv pip install --python .venv/bin/python -e .
          PKG=$(basename "$(find src -maxdepth 1 -mindepth 1 -type d ! -name '*.egg-info' | sort | head -1)")
          .venv/bin/python -m pytest tests/ --cov="src/$PKG" --cov-report=xml --cov-report=term

  build:
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # Build via uv's native frontend — wheel + sdist into dist/.
      # fail-loud on empty dist.
      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml
      # THE DOCS ARE BUILT INTO THE WHEEL HERE, not committed to the branch.
      #
      # scitex-cloud serves package docs from the in-wheel `_sphinx_html/`
      # (audit rule PS-121); without it the package is invisible at
      # https://scitex.ai/apps/docs/. The previous mechanism built the HTML in
      # the `docs` workflow, committed 99 files to `develop`, and pushed —
      # which CANNOT SUCCEED, because `develop` is a protected branch requiring
      # a pull request and 6 status checks. Measured on run 31945230744:
      #
      #   remote: error: GH006: Protected branch update failed for refs/heads/develop.
      #   remote: - Changes must be made through a pull request.
      #    ! [remote rejected] develop -> develop (protected branch hook declined)
      #
      # That rejection was swallowed by `git push || echo` under
      # `continue-on-error: true`, so the step reported SUCCESS on every merge
      # while the directory stayed empty from 2026-06-17 to 2026-08-16.
      #
      # Building it here removes the impossible push instead of working around
      # it: the artifact reaches the wheel, git never tracks 15k lines of
      # generated HTML, and no branch protection has to be weakened.
      - name: Build docs into the package (in-wheel _sphinx_html, PS-121)
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv-docs
          uv pip install --python .venv-docs/bin/python -e .
          uv pip install --python .venv-docs/bin/python -r docs/sphinx/requirements.txt
          .venv-docs/bin/python -m sphinx -b html -W --keep-going \
            docs/sphinx docs/sphinx/_build/html
          rm -rf src/scitex_cards/_sphinx_html
          cp -rf docs/sphinx/_build/html src/scitex_cards/_sphinx_html
          # Fail LOUD here rather than shipping a wheel with no docs: this is
          # the step whose predecessor reported success while producing nothing.
          [ -f src/scitex_cards/_sphinx_html/index.html ] \
            || { echo "::error::sphinx produced no index.html — the wheel would ship without docs"; exit 1; }
      - name: Build wheel + sdist (uv build)
        run: |
          set -euo pipefail
          uv build
          # The scitex-cards DEPRECATION STUB publishes from the same tag
          # (metadata-only dist depending on scitex-cards; PyPI has no
          # rename, so old pins must keep resolving). Same dist/, same
          # OIDC exchange — both projects' trusted publishers key on this
          # repo + this workflow file + the pypi environment. Version sync
          # is enforced by tests/test_stub_version_sync.py.
          if [ -d stub/scitex-cards ]; then
            uv build stub/scitex-cards --out-dir dist
          fi
          ls -la dist/
          [ -n "$(ls -A dist 2>/dev/null)" ] || { echo "::error::uv build produced an empty dist/"; exit 1; }
          # ASSERT ON THE WHEEL, NOT ON THE WORKING TREE. The docs are now
          # gitignored, and a gitignored path reaches the wheel ONLY via
          # hatchling's `artifacts` list — so a correct sphinx build plus a
          # wrong packaging config produces a green build and a docs-less
          # wheel, which is the same silent failure this change removes, one
          # layer down. The previous mechanism had no check at this layer at
          # all; that is why it went two months undetected.
          whl=$(ls dist/scitex_cards-*.whl | head -1)
          python3 -c "
import sys, zipfile
names = zipfile.ZipFile('$whl').namelist()
hit = [n for n in names if n.endswith('_sphinx_html/index.html')]
if not hit:
    sys.exit('::error::$whl ships no _sphinx_html/index.html — '
             'scitex-cloud would serve nothing for this package (PS-121). '
             'Check [tool.hatch.build.targets.wheel] artifacts in pyproject.toml.')
print(f'in-wheel docs OK: {hit[0]}')
"
      # upload-artifact is a JS action — runs fine on the self-hosted runner.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-cards
    # id-token: write is what populates ACTIONS_ID_TOKEN_REQUEST_{TOKEN,URL},
    # which publish-in-sif.sh uses to mint the OIDC JWT. Keep it.
    # contents: read is REQUIRED for actions/checkout to clone this PRIVATE
    # repo — declaring `permissions:` at all defaults every unlisted scope to
    # `none`, so without this the token can't read the repo and checkout fails
    # with "Repository not found" (the release break v0.7.21..v0.7.28).
    permissions:
      id-token: write
      contents: read
    steps:
      # Need the repo checked out so .github/ci/publish-with-uv.sh is on
      # disk (the build job uploaded only dist/).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Manual OIDC trusted publishing — pypa/gh-action-pypi-publish is a
      # Docker action and the Spartan compute nodes have no Docker.
      # publish-with-uv.sh: GitHub OIDC JWT (audience=pypi) → PyPI mint-token →
      # twine upload dist/*, python provisioned by uv. fail-loud at each step.
      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml
      - name: Publish to PyPI via manual OIDC trusted publishing (uv python)
        run: bash .github/ci/publish-with-uv.sh

  release:
    needs: [build, publish]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      # JS action that talks to the GitHub Releases API directly. The bare
      # Spartan self-hosted runner has NO `gh` CLI, so the old `gh release
      # create` failed with `gh: command not found` (exit 127) AFTER publish --
      # PyPI shipped but no Release page. JS actions run fine on the self-hosted
      # runner (same class as actions/checkout + upload-artifact), so this is the
      # fail-loud-safe equivalent: CHANGELOG notes + dist/* assets, no `gh` dep.
      # Needs the job's `permissions: contents: write` (already set); the action
      # uses ${{ github.token }} by default.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
