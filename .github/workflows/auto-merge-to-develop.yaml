name: auto-merge-to-develop
# Merge green PRs that TARGET develop, the moment their checks complete.
#
# GitHub reads check_suite-triggered workflows from the DEFAULT branch (main),
# so this file must reach main to have any effect. It acts ONLY on PRs whose
# base is develop.
#
# ── CALLER, not a copy (PS-231) ────────────────────────────────────────────
# The body used to be ~150 lines of inlined curl re-implementing the org
# workflow. A local copy does not track fixes made org-side, which is the
# whole point of the rule: the `scitex-ci` runner-label defect was fixed
# org-side on 2026-08-15 and every private copy kept it.
#
# ── WHY ubuntu-latest AND NOT THE SPARTAN POOL ─────────────────────────────
# `runs_on` is passed EXPLICITLY, per PS-231's own instruction, so the runner
# decision stays visible in this file instead of silently moving upstream.
# It must be a JSON ARRAY STRING — the input is consumed by `fromJSON`, and a
# YAML list decodes to something fromJSON rejects, producing a label mismatch
# that makes the job QUEUE FOREVER rather than fail.
#
# The value is ubuntu-latest for three measured reasons, all of which reverse
# the old `runs-on: [self-hosted, Linux, X64, spartan-cpu]`:
#
#   1. THE ORG BODY NEEDS `gh`. It calls `gh pr view` / `gh api` / `gh pr
#      merge` at nine sites. The comment this file used to carry states that
#      the Spartan runners have NO `gh` CLI — which is exactly why the old
#      body was hand-rewritten to curl. Worse, nearly every `gh` call in the
#      org body ends `|| true` or `|| echo ""`, so on a runner without `gh`
#      it would not fail: it would merge NOTHING and report success.
#   2. THIS REPO IS PUBLIC. The old comment justified Spartan as "the
#      no-paid-runner rule for this private repo" — measured 2026-08-23,
#      `visibility: PUBLIC`. GitHub-hosted minutes are free for public
#      repositories, so the cost argument that chose Spartan does not apply
#      and never did.
#   3. THE SPARTAN POOL HAS BEEN WHOLLY OFFLINE. All four runners were
#      `status=offline` on 2026-08-13 (see rtd-sphinx-build-on-ubuntu-latest
#      .yml), which is why the org default itself moved to GitHub-hosted on
#      2026-08-15. A job pinned to an offline pool queues silently.
#
# ── BEHAVIOUR CHANGE, STATED LOUDLY ────────────────────────────────────────
# The org body requires an `automerge-ok` LABEL on the PR (opt-in, added
# org-side 2026-07-22). The inlined body did not. So after this change a green
# PR targeting develop DOES NOT auto-merge unless it carries that label.
#
# That is a safety improvement, not a regression — without it an ungated body
# merges any green develop-PR the moment a third-party check suite fires, and
# the only thing that historically prevented it was GitHub's GITHUB_TOKEN
# recursion prevention, which is incidental rather than designed. But it does
# mean auto-merge is silent until labels are applied, so it is recorded here
# rather than discovered.
#
# ── PERMISSIONS ────────────────────────────────────────────────────────────
# `actions: write` is REQUIRED and is not inherited by wishing: the org body
# dispatches post-merge gate workflows on develop, and without this scope
# every dispatch 403s — which lands un-CI'd commits on develop, the exact
# failure the gates exist to stop.
on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      # JSON array string — NOT a YAML list. See the note above.
      runs_on: '["ubuntu-latest"]'
