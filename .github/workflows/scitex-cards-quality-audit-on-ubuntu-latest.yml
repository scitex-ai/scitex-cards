name: quality

# Single-package quality gate — runs `scitex-dev ecosystem audit-all`
# against this package. Mirrors the canonical audit that
# `tests/develop/test_audit.py` runs inside the test suite, but as a
# standalone gate so an audit regression is visible even when the matrix
# is skipped.
#
# `--no-version-check` WAS HERE AND IS NOW GONE. It silenced "is the rule
# corpus current?" — the one check that reports the auditor having grown
# rules this config has never seen. Measured 2026-08-16 on this tree: the
# run WITH the flag and the run WITHOUT it are byte-identical (both exit 0,
# both "0 net-new finding(s)"). It was buying nothing and hiding a signal,
# so removing it costs nothing and is not a judgement call.
#
# `--new-only` IS GONE, BY OPERATOR RULING 2026-08-18: 「--new-only は禁止
# です！！！」 followed by 「いかなるパッケージも、です。」 — forbidden, for
# ANY package. Ecosystem-wide, not a scitex-cards decision.
#
# It is not reinstated by a backlog, and the plan that used to live here —
# "burn the backlog down, THEN drop the flag" — is withdrawn. That ordering
# was backwards: it kept the gate blind for exactly as long as the backlog
# took, which is the period the gate was most needed.
#
# WHAT THIS COSTS, re-measured 2026-08-18 at HEAD rather than quoted from
# the 08-16 note that used to sit here (that note said "keyed 51 + unkeyed
# 84" and is now wrong in the unsafe direction):
#
#     summary: 318 unmasked error(s) (+47 warning/info), 0 masked by
#              skip-rules (0 declared); 380 line(s) inspected
#     of which Python API: 278 violation(s); skills: 8
#
# This job now reports all of it and FAILS until it is fixed. That red is
# the true state of this package and has been all along — the flag was the
# only thing making it look otherwise.
#
# TWO THINGS ABOUT READING THAT OUTPUT, both learned the hard way tonight.
# The per-section prefix is `ERRO:`, not `ERROR`, so a grep for '^ERROR'
# returns 0 against a run holding 318 of them. And the `summary:` line is a
# TALLY, not the verdict — the auditor says so itself. Read the findings,
# and trust the exit status over any count you derived yourself.
#
# The 08-16 figure being nearly 3x too low is itself evidence for the
# operator's other ruling: the corpus grew between then and now, so a
# remembered number decays even when the code does not change.
#
# WHY THE RULING IS RIGHT, measured the same night it was made. sac and
# scitex-cards hit the same auditor-corpus drift within an hour:
#
#     sac     floor, full audit    -> RED on a 5-line pyproject change
#     cards   floor, --new-only    -> GREEN through FIVE auditor releases
#
# Same corpus, same drift, opposite signals — and the one that stayed green
# is the one that had stopped measuring. The operator's other ruling that
# night makes it sharper: 「最新のdevで監査してください、これは全ての
# パッケージ共通の約束事です」. If the audit is a promise common to every
# package, a gate configured never to fail is a package that has quietly
# stopped making the promise while still displaying a green check.
#
# Anything that genuinely must stay is exempted PER FILE WITH A WRITTEN
# REASON in `.scitex/dev/config.yaml` — reviewable and individually
# retirable (`scitex-dev ecosystem list-exemptions` shows them). An
# exemption is a decision someone made and signed; `--new-only` was a
# decision nobody made about violations nobody enumerated.
#
# Backlog card: cards-strict-audit-burndown-114-errors-20260815.
#
# Project-type + rule skips live in `.scitex/dev/config.yaml` in this
# checkout and are applied automatically.
#
# THE DISTRIBUTION ARGUMENT IS `scitex-cards`, AND IT USED TO BE WRONG.
# It passed `scitex-cards` — the pre-rename name — so the auditor evaluated
# this tree against a package layout that does not exist here, and every
# project-structure finding demanded the OLD shape: PS-105 "missing
# scitex_cards/__main__.py", PS-201 "missing tests/scitex_cards/ parent",
# PS-302 "rename tests/scitex_cards/ to tests/scitex_cards/scitex_cards/",
# PS-203 x9 loose top-level. Findings about a package that is not here.
#
# That was not merely noise, it made the gate NON-DETERMINISTIC ACROSS
# UNRELATED CHANGES. Those findings roll up into a summary line
#
#     ERRO: scitex-cards (<abs path>): project-structure: 14 error(s), 56 warning(s), 4 info
#
# whose subject carries a parenthesised path, which `_FINDING_RE` in
# scitex-dev's `_cli/audit/_diff.py` cannot match. It therefore falls
# through to the ERRO fail-open and is keyed by the WHOLE LINE — counts
# included. Adding one markdown file under `docs/adr/` moved `4 info` to
# `6 info`, which swapped that key: one out, one in, totals unchanged.
# The gate reported "1 net-new finding" against "131 at HEAD (131 at
# baseline)" and stayed red across a re-run of the identical commit,
# because it was deterministic rather than flaky. Diagnosed with
# scitex-dev 2026-08-02; they are fixing the keying itself so a tally can
# never be attributed. Auditing the distribution that actually exists is
# this repo's half, and it is correct independently of that fix.
#
# Runner: `ubuntu-latest`, as the `runs-on:` below actually says. This
#   comment used to describe self-hosted Spartan CPU runners and an Actions
#   billing block that made GitHub-hosted runners unavailable — neither of
#   which matches the job as configured, so it described a setup this file
#   does not use. The `-on-ubuntu-latest` filename here is genuine, and
#   elsewhere in the fleet it is kept for naming consistency
#   (cf. scitex-io / scitex-app / scitex-plt); it is a naming convention,
#   not a runtime assertion — same as rtd-sphinx-build-on-ubuntu-latest.
#   `actions/setup-python` has no tool cache on a self-hosted runner, so
#   `uv` provisions the interpreter and the venv.

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC (~03:00 JST), after the test run
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".scitex/dev/config.yaml"
      - ".github/workflows/scitex-cards-quality-audit-on-ubuntu-latest.yml"
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml

      # Kept although --new-only is gone: the auditor still reports the
      # branch/base it graded, and a missing develop ref makes that line
      # read "via explicit" with no baseline named. Cheap, and it keeps the
      # provenance in the log honest.
      - name: Fetch develop ref so the audit can name what it graded
        run: git fetch origin develop:develop || true

      - name: Install package + audit tooling
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]" \
            || uv pip install --python .venv/bin/python -e ".[dev]" \
            || uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python "scitex-dev[cli-audit]>=0.17.14"

      - name: Run scitex-dev ecosystem audit-all (FULL — no --new-only)
        # .venv/bin on PATH so the auditor's `shutil.which("scitex-dev")`
        # and the per-auditor subprocess spawns resolve to THIS venv
        # (where scitex-cards's console-script is installed).
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          scitex-dev ecosystem audit-all scitex-cards --path "$PWD"
